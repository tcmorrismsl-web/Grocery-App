<!doctype html>
<html lang="en">
<head>
<!--HEAD-ONLY-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf Tag">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!--/HEAD-ONLY-->
<title>Shelf Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky screen title, list content, fixed bottom tab bar.
   The shelf-tag yellow is the single loud element: it marks the cheapest price. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunken:#E6EAE3; --ink:#17201B; --muted:#5A665E; --line:#D7DDD4;
  --accent:#1D5A45; --accent-ink:#FFFFFF; --tag:#F5C62E; --tag-ink:#231C02;
  --ns-a:#1C8A4C; --ns-b:#5FA834; --ns-c:#C99A12; --ns-d:#DB7410; --ns-e:#CC3A16; --on-grade:#FFFFFF;
  --danger:#B3261E; --scrim:rgba(10,14,12,.45);
  --display:"Archivo","Arial Narrow",-apple-system,system-ui,sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#171E1A; --sunken:#1F2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2B3530;
    --accent:#6CC79E; --accent-ink:#06140D; --tag:#EDC03A; --tag-ink:#1F1802;
    --ns-a:#2E9F5C; --ns-b:#6EAF42; --ns-c:#C99A12; --ns-d:#D9741A; --ns-e:#D2482A; --on-grade:#FFFFFF;
    --danger:#F2867E; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --sunken:#1F2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2B3530;
  --accent:#6CC79E; --accent-ink:#06140D; --tag:#EDC03A; --tag-ink:#1F1802;
  --ns-a:#2E9F5C; --ns-b:#6EAF42; --ns-c:#C99A12; --ns-d:#D9741A; --ns-e:#D2482A; --on-grade:#FFFFFF;
  --danger:#F2867E; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notch-fill{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:560px;margin:0 auto;padding-inline:16px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.eyebrow svg{width:16px;height:12px}
h1{margin:0;font-family:var(--display);font-stretch:72%;font-weight:800;font-size:38px;line-height:1;letter-spacing:-.01em;text-wrap:balance}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* Banner */
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--sunken);border:1px dashed var(--muted);
  border-radius:var(--r);padding:10px 12px;font-size:13px;margin-block:4px 6px}
.banner p{margin:0}

/* Generic */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 8px;
  font:700 12px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec .count{font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:16px;margin:0;text-align:left}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;line-height:1.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger.armed{background:var(--danger);color:var(--bg);border-color:transparent}
.btn.wide{width:100%}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn-link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;text-align:left}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
input[type=text],input[type=number],input[type=date],input[type=search],select{
  width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline>input{flex:1;min-width:0}

/* Grade chip (Nutri-Score style A–E) */
.grade{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;color:var(--on-grade);
  font:800 13px/1 var(--display);font-stretch:85%;vertical-align:middle;font-variant-numeric:tabular-nums}
.g-a{background:var(--ns-a)}.g-b{background:var(--ns-b)}.g-c{background:var(--ns-c)}.g-d{background:var(--ns-d)}.g-e{background:var(--ns-e)}
.g-none{background:var(--sunken);color:var(--muted)}

/* Shelf tag */
.tag{position:relative;display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center;flex:none;
  min-width:68px;padding:5px 8px 4px 14px;border-radius:3px 6px 6px 3px;background:var(--tag);color:var(--tag-ink)}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
.tag b{font:800 20px/1 var(--display);font-stretch:78%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tag i{font:600 9.5px/1.3 var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.07em;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.none{background:var(--sunken);color:var(--muted)}
.tag .card-mark{font-size:9px;font-weight:700;letter-spacing:.06em}

/* Stepper */
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex:none}
.step button{width:34px;height:32px;border:0;background:none;font-size:18px;line-height:1;color:var(--ink)}
.step span{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* Add bar */
.addbar{display:flex;gap:8px;margin-top:4px}
.addbar input{flex:1;min-width:0}
.matches{list-style:none;margin:6px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.matches li+li{border-top:1px solid var(--line)}
.matches button{width:100%;text-align:left;background:none;border:0;padding:11px 14px;font-weight:600}
.matches button:disabled{opacity:.55}

/* Suggestions */
.sugg li{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sugg .who{flex:1;min-width:0;font-weight:600}
.pill{display:inline-block;font:600 11.5px/1.2 var(--body);padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.out{background:color-mix(in srgb,var(--ns-e) 16%,transparent);color:var(--ns-e)}
.pill.low{background:color-mix(in srgb,var(--ns-c) 20%,transparent);color:var(--ink)}

/* List rows */
.lrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 12px 10px 8px}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent}
.check svg{width:16px;height:16px}
.lrow.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lrow.done .lname b{text-decoration:line-through;color:var(--muted)}
.lname{border:0;background:none;text-align:left;padding:0;min-width:0}
.lname b{font-weight:600;font-size:15.5px}
.lmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}

/* Compare */
.compare{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
.cmp+.cmp{border-top:1px solid var(--line)}
.cmp b{font:800 19px/1 var(--display);font-stretch:80%;font-variant-numeric:tabular-nums}
.cmp.split{background:var(--sunken)}
.cmp .lead{font-weight:600}

/* Buy again chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px}
.chip::before{content:"+ ";color:var(--accent)}

/* Pantry */
.prow2{display:flex;align-items:center;gap:10px;padding:10px 12px}
.prow2 .lname{flex:1}
.mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.mini svg{width:16px;height:16px}
.seg{display:flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.summary{display:flex;gap:18px;margin-top:12px}
.summary div{display:flex;flex-direction:column}
.summary b{font:800 30px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.summary span{font-size:12.5px;color:var(--muted)}

/* Prices */
.prow{display:flex;flex-direction:column;gap:8px;width:100%;border:0;background:none;text-align:left;padding:12px 14px}
.pname{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname small{flex-basis:100%}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:5px;width:100%}
.cell{display:flex;flex-direction:column;align-items:flex-start;padding:5px 8px;border-radius:6px;background:var(--sunken);min-width:0}
.cell i{font:600 9.5px/1.3 var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell b{font:800 17px/1.1 var(--display);font-stretch:80%;font-variant-numeric:tabular-nums}
.cell.best{background:var(--tag);color:var(--tag-ink)}
.cell.best i{color:var(--tag-ink)}
.cell.none b{color:var(--muted);font-weight:600}

/* Health */
.hero{display:flex;align-items:flex-end;gap:16px;margin-top:16px}
.hero .num{font:800 76px/.82 var(--display);font-stretch:68%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .grade{min-width:34px;height:34px;font-size:20px;border-radius:8px;margin-bottom:4px}
.hero p{margin:0}
.hero .lbl{font-weight:600}
.chart{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--body)}
.chart .val{fill:var(--ink);font:800 12px var(--display);font-stretch:80%}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cols>div{min-width:0}
.cols .list li{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:14px;min-width:0}
.cols .list li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols h3{margin:0 0 6px;font-size:13px;font-weight:600}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px}
.trip .amt{font:800 18px/1 var(--display);font-stretch:80%;font-variant-numeric:tabular-nums;text-align:right}
.trip .btn-link{grid-column:1/-1;padding:2px 0 0;font-size:13.5px;justify-self:start}

/* Settings */
.store-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 36px;gap:8px;align-items:center;padding:10px 12px}
.store-row input{min-height:40px;padding:8px 10px}
.store-row .live{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.store-row .live span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ns-a);margin-right:6px;vertical-align:1px}
.cell .live-dot{width:5px;height:5px;margin-right:3px}
.live-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.status-ok{color:var(--ns-a);font-weight:600}
.status-bad{color:var(--danger);font-weight:600}
.prose{font-size:14px;max-width:62ch}
.prose p{margin:0 0 10px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;margin-top:2px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:10px;line-height:16px;margin-left:2px;font-variant-numeric:tabular-nums}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet-head h2{margin:0;font:800 28px/1.05 var(--display);font-stretch:75%;text-wrap:balance}
.statline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.statline p{margin:0}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
legend{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 4px}
.score-row{display:flex;align-items:center;gap:10px}
.score-row input{max-width:120px}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000}
.off-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.off-list button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.off-list img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:var(--surface);flex:none}
.off-list span{min-width:0;flex:1}
.ptable li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px}
.co-row{display:grid;grid-template-columns:28px minmax(0,1fr) 64px 92px;gap:8px;align-items:center;padding:9px 10px}
.co-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.co-row input[type=number]{padding:8px;min-height:40px;text-align:right}
.co-head{display:grid;grid-template-columns:28px minmax(0,1fr) 64px 92px;gap:8px;padding:0 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.co-head span:nth-child(n+3){text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.total b{font:800 30px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;display:flex;gap:12px;align-items:center;
  max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:var(--tag);font-weight:700;padding:4px 0;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:360px){h1{font-size:32px}.co-row,.co-head{grid-template-columns:24px minmax(0,1fr) 54px 80px}}
</style>
</head>
<body>
<div class="notch-fill"></div>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow"><svg viewBox="0 0 16 12" aria-hidden="true"><path d="M4 0h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4L0 6z" style="fill:var(--tag)"/><circle cx="4.5" cy="6" r="1.3" style="fill:var(--bg)"/></svg>Shelf Tag</span>
      <h1 id="screenTitle">List</h1>
    </div>
    <button class="icon-btn" data-action="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="inner">
    <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span>List<span id="listBadge"></span></span></button>
    <button data-tab="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 10h16M4 16h16M9 6.5h2M9 13h2"/></svg><span>Pantry</span></button>
    <button data-tab="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4.5A1.5 1.5 0 0 1 4.5 3H12l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg><span>Prices</span></button>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" data-action="close-sheet"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <div id="sheetBody"></div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY = 'shelftag.v1', UIKEY = 'shelftag.ui';
const LOCS = [['pantry','Pantry'],['fridge','Fridge'],['freezer','Freezer'],['other','Other']];
const CATS = ['Produce','Dairy & eggs','Meat & seafood','Bakery','Pantry','Frozen','Snacks','Drinks','Household','Other'];
const UNITS = ['oz','fl oz','lb','g','kg','ml','l','gal','ct','each'];
const TITLES = {list:'List', pantry:'Pantry', prices:'Prices', health:'Health', settings:'Settings'};
const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const ICON_CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n == null || isNaN(n)) ? '—' : '$' + Number(n).toFixed(2);
const round2 = n => Math.round(n * 100) / 100;
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s){ const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2] || 1); }
function today(){ return iso(new Date()); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate() + Math.round(n)); return iso(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function fmtDate(s){ return parse(s).toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
function cmpDate(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }
function num(v){ if (v === '' || v == null) return null; const n = Number(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; }
function grade(score){ if (score == null) return null; return score >= 80 ? 'A' : score >= 60 ? 'B' : score >= 40 ? 'C' : score >= 20 ? 'D' : 'E'; }
function gradeChip(score, withNum){
  const g = grade(score);
  if (!g) return '<span class="grade g-none" title="No health score yet">?</span>';
  return `<span class="grade g-${g.toLowerCase()}" title="Health score ${Math.round(score)} of 100">${withNum ? Math.round(score) : g}</span>`;
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sizeText(it){ return it.size ? (it.size + ' ' + (it.unit || '')).trim() : ''; }
// "Harris Teeter" → "HT", "Sam's Club" → "SC"; short single names stay as they are.
function shortName(n){ n = String(n || ''); const w = n.split(/\s+/).filter(Boolean); return (w.length > 1 && n.length > 8) ? w.map(x => x[0]).join('').toUpperCase() : n; }
function storeName(id){ const s = S.stores.find(x => x.id === id); return s ? s.name : 'Unknown store'; }

/* ---------- state ---------- */
function defaultState(){
  return {version:1, stores:[], items:[], prices:[], purchases:[], usage:[], list:[], sample:false, settings:{suggestDays:4, live:{url:'', key:''}, zip:'', lastRefresh:0}};
}

function sampleState(){
  const r = rng(20261009), t = today(), s = defaultState();
  s.sample = true;
  // name, card program, price factor vs base, card discount factor
  const stores = [['Harris Teeter','VIC card',1.07,0.88],['Food Lion','MVP card',0.98,0.9],['Walmart','',0.9,1],['Publix','Club Publix',1.1,0.9],['Sam’s Club','Membership',0.84,1]];
  s.stores = stores.map((x, i) => ({id:'s' + i, name:x[0], card:x[1]}));
  // name, brand, category, location, score, every N days, base price, size, unit
  const D = [
    ['2% milk','Store brand','Dairy & eggs','fridge',70,6,3.79,1,'gal'],
    ['Large eggs','Eggland’s Best','Dairy & eggs','fridge',74,9,3.99,12,'ct'],
    ['Bananas','','Produce','other',96,5,1.69,'',''],
    ['Baby spinach','Organic Girl','Produce','fridge',98,7,3.49,5,'oz'],
    ['Chicken breast','Store brand','Meat & seafood','fridge',86,7,8.99,2,'lb'],
    ['Plain Greek yogurt','Fage','Dairy & eggs','fridge',82,10,6.49,32,'oz'],
    ['Whole wheat bread','Nature’s Own','Bakery','pantry',66,8,3.79,20,'oz'],
    ['Sharp cheddar','Tillamook','Dairy & eggs','fridge',36,14,4.29,8,'oz'],
    ['Rolled oats','Quaker','Pantry','pantry',92,30,5.29,42,'oz'],
    ['Spaghetti','Barilla','Pantry','pantry',64,12,1.99,16,'oz'],
    ['Marinara sauce','Rao’s','Pantry','pantry',56,14,7.99,24,'oz'],
    ['Frozen broccoli','Birds Eye','Frozen','freezer',97,10,2.49,12,'oz'],
    ['Potato chips','Lay’s','Snacks','pantry',22,8,4.99,8,'oz'],
    ['Chocolate chip cookies','Chips Ahoy!','Snacks','pantry',10,15,4.29,13,'oz'],
    ['Ground coffee','Dunkin’','Drinks','pantry',84,18,9.49,12,'oz'],
    ['Peanut butter','Jif','Pantry','pantry',46,24,3.49,16,'oz']
  ];
  s.items = D.map((d, i) => ({id:'i' + i, name:d[0], brand:d[1], category:d[2], location:d[3], score:d[4], scoreSource:'manual', size:d[7], unit:d[8], barcode:'', onHand:0}));
  const trips = [];
  for (let day = -430; day <= -1; day += 3 + Math.floor(r() * 4)) {
    const w = r(); trips.push({id:'t' + trips.length, day, si: w < 0.35 ? 0 : w < 0.6 ? 2 : w < 0.78 ? 1 : w < 0.9 ? 3 : 4});
  }
  D.forEach((d, i) => {
    let next = -430 + Math.floor(r() * d[5]), last = null;
    for (const tr of trips) {
      if (tr.day < next) continue;
      const price = round2(d[6] * stores[tr.si][2] * (0.95 + r() * 0.1));
      s.purchases.push({id:uid(), tripId:tr.id, itemId:'i' + i, storeId:'s' + tr.si, date:addDays(t, tr.day), qty:1, price, score:d[4], name:d[0]});
      let step = d[5] * (0.8 + r() * 0.45);
      if (d[4] < 35 && tr.day > -120) step *= 1.7;   // fewer snacks lately
      next = tr.day + Math.round(step); last = tr.day;
    }
    s.items[i].onHand = (last == null || -last >= d[5]) ? 0 : 1;
    stores.forEach((st, si) => {
      if (si > 0 && r() < 0.12) return;
      const price = round2(d[6] * st[2] * (0.97 + r() * 0.06));
      const card = (st[3] < 1 && r() < 0.45) ? round2(price * (st[3] + r() * 0.06)) : null;
      s.prices.push({id:uid(), itemId:'i' + i, storeId:'s' + si, price, card, date:addDays(t, -Math.floor(r() * 21))});
    });
  });
  s.list = s.items.filter(i => i.onHand <= 0).slice(0, 4).map(i => ({itemId:i.id, qty:1, checked:false}));
  return s;
}

function migrate(s){
  const d = defaultState();
  for (const k in d) if (s[k] == null) s[k] = d[k];
  s.settings = Object.assign(d.settings, s.settings || {});
  s.settings.live = Object.assign({url:'', key:''}, s.settings.live || {});
  return s;
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return sampleState();
}

let S = load(), memo = null;
let ui = {tab:'list', pantryLoc:'all', showOut:false, healthMode:'week'};
try { Object.assign(ui, JSON.parse(localStorage.getItem(UIKEY) || '{}')); } catch (e) {}
if (ui.tab === 'settings') ui.tab = 'list';

function save(){ memo = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify({tab:ui.tab === 'settings' ? 'list' : ui.tab, pantryLoc:ui.pantryLoc, showOut:ui.showOut, healthMode:ui.healthMode})); } catch (e) {} }
save();

/* ---------- derived data ---------- */
function idx(){
  if (memo) return memo;
  const byItem = {}, latest = {}, items = {};
  for (const it of S.items) items[it.id] = it;
  for (const p of S.purchases) (byItem[p.itemId] || (byItem[p.itemId] = [])).push(p);
  for (const k in byItem) byItem[k].sort(cmpDate);
  for (const p of S.prices) { const k = p.itemId + '|' + p.storeId, c = latest[k]; if (!c || p.date >= c.date) latest[k] = p; }
  return (memo = {byItem, latest, items});
}
const getItem = id => idx().items[id];
const eff = p => (p.card != null && p.card < p.price) ? p.card : p.price;

function priceTable(itemId){
  const ix = idx();
  const rows = S.stores.map(store => { const p = ix.latest[itemId + '|' + store.id] || null; return {store, p, eff: p ? eff(p) : null}; });
  let best = null;
  rows.forEach(r => { if (r.eff != null && (!best || r.eff < best.eff)) best = r; });
  return {rows, best};
}

function stats(itemId){
  const ps = idx().byItem[itemId] || [], n = ps.length;
  if (!n) return {n:0};
  const last = ps[n - 1], out = {n, last};
  if (n >= 2) {
    const units = ps.slice(0, -1).reduce((a, p) => a + (p.qty || 1), 0);
    const span = diffDays(ps[0].date, last.date);
    if (span > 0 && units > 0) { out.dpu = span / units; out.due = addDays(last.date, out.dpu * Math.max(1, last.qty || 1)); }
  }
  return out;
}

function status(it){
  const st = stats(it.id), win = Number(S.settings.suggestDays) || 4;
  if ((it.onHand || 0) <= 0) return {level:'out', label: st.n ? 'Out' : 'None on hand', st, rank:-1};
  if (!st.due) return {level:'ok', label: it.onHand + ' on hand', st, rank:999};
  const d = diffDays(today(), st.due);
  if (d < 0) return {level:'low', label:'Probably running low', st, rank:d};
  if (d === 0) return {level:'low', label:'Likely runs out today', st, rank:0};
  if (d <= win) return {level:'low', label:`Runs out in ~${d} day${d === 1 ? '' : 's'}`, st, rank:d};
  return {level:'ok', label:`~${d} days left`, st, rank:d};
}

function suggestions(){
  const onList = new Set(S.list.map(l => l.itemId));
  return S.items.filter(i => !onList.has(i.id))
    .map(i => ({i, s:status(i)}))
    .filter(x => x.s.st.n > 0 && x.s.level !== 'ok')
    .sort((a, b) => a.s.rank - b.s.rank);
}

function listCompare(){
  const per = S.stores.map(st => ({st, total:0, missing:0}));
  let split = 0, splitMissing = 0; const splitStores = new Set();
  for (const l of S.list) {
    const pt = priceTable(l.itemId);
    pt.rows.forEach((r, i) => { if (r.eff == null) per[i].missing++; else per[i].total += r.eff * l.qty; });
    if (pt.best) { split += pt.best.eff * l.qty; splitStores.add(pt.best.store.id); } else splitMissing++;
  }
  per.sort((a, b) => a.missing - b.missing || a.total - b.total);
  return {per, split, splitMissing, splitStores};
}

function scoreOf(p){ const it = getItem(p.itemId); return it && it.score != null ? it.score : (p.score != null ? p.score : null); }
function periodKey(dateStr, mode){
  const d = parse(dateStr);
  if (mode === 'year') return String(d.getFullYear());
  if (mode === 'month') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  const s = new Date(d); s.setDate(d.getDate() - d.getDay()); return iso(s);
}
function periodKeys(mode){
  const t = parse(today()), keys = [];
  if (mode === 'year') {
    const years = S.purchases.map(p => parse(p.date).getFullYear());
    const first = Math.max(Math.min(t.getFullYear(), ...years), t.getFullYear() - 4);
    for (let y = first; y <= t.getFullYear(); y++) keys.push(String(y));
    return keys;
  }
  const n = mode === 'week' ? 8 : 12;
  for (let i = n - 1; i >= 0; i--) {
    let d;
    if (mode === 'week') { d = new Date(t); d.setDate(t.getDate() - t.getDay() - 7 * i); }
    else d = new Date(t.getFullYear(), t.getMonth() - i, 1);
    keys.push(periodKey(iso(d), mode));
  }
  return keys;
}
function periodLabel(k, mode){
  if (mode === 'year') return k;
  if (mode === 'month') return parse(k + '-01').toLocaleDateString(undefined, {month:'short'});
  return fmtDate(k);
}
function healthMap(mode){
  const m = {};
  for (const p of S.purchases) {
    const s = scoreOf(p); if (s == null) continue;
    const k = periodKey(p.date, mode), q = p.qty || 1;
    const e = m[k] || (m[k] = {sum:0, w:0});
    e.sum += s * q; e.w += q;
  }
  return m;
}

function trips(){
  const g = {};
  for (const p of S.purchases) {
    const k = p.tripId || (p.date + '|' + p.storeId);
    const t = g[k] || (g[k] = {id:k, date:p.date, storeId:p.storeId, items:[], total:0, sum:0, w:0});
    t.items.push(p); t.total += (p.price || 0) * (p.qty || 1);
    const s = scoreOf(p); if (s != null) { t.sum += s * (p.qty || 1); t.w += (p.qty || 1); }
  }
  return Object.values(g).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}

/* ---------- toast ---------- */
let toastTimer = null, toastFn = null;
function toast(msg, action){
  const el = $('#toast');
  toastFn = action ? action.fn : null;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-action="toast-act">${esc(action.label)}</button>` : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}

/* ---------- render ---------- */
function render(){
  $('#screenTitle').textContent = TITLES[ui.tab];
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const n = S.list.length;
  $('#listBadge').innerHTML = n ? ` <span class="badge">${n}</span>` : '';
  $('#banner').innerHTML = S.sample
    ? `<div class="banner"><p>These are sample items, prices and trips so you can see how it works.</p><button class="btn btn-sm" data-action="clear-sample">Start fresh</button></div>`
    : '';
  const v = $('#view');
  if (ui.tab === 'list') v.innerHTML = viewList();
  else if (ui.tab === 'pantry') v.innerHTML = viewPantry();
  else if (ui.tab === 'prices') v.innerHTML = viewPrices();
  else if (ui.tab === 'health') v.innerHTML = viewHealth();
  else v.innerHTML = viewSettings();
  saveUI();
}

function tagFor(pt){
  if (!pt.best) return '<span class="tag none"><b>—</b><i>No price</i></span>';
  const p = pt.best.p, card = p.card != null && p.card < p.price;
  return `<span class="tag"><b>${money(pt.best.eff)}</b><i>${esc(pt.best.store.name)}${card ? ' · card' : ''}</i></span>`;
}

/* List */
function viewList(){
  const sugg = suggestions().slice(0, 6);
  const rows = S.list.filter(l => getItem(l.itemId));
  let h = `<div class="addbar"><input type="search" id="addInput" placeholder="Add to list…" autocomplete="off" enterkeyhint="done" aria-label="Add an item to the list"><button class="btn" data-action="new-item">New item</button></div><div id="addMatches"></div>`;
  if (sugg.length) {
    h += `<h2 class="sec">Running low <span class="count">${sugg.length}</span></h2><ul class="list sugg">` +
      sugg.map(x => `<li><span class="who">${esc(x.i.name)}<small>${x.s.st.dpu ? `Usually every ~${Math.max(1, Math.round(x.s.st.dpu))} days · ` : ''}last bought ${fmtDate(x.s.st.last.date)}</small></span><span class="pill ${x.s.level}">${esc(x.s.label)}</span><button class="mini" data-action="add-to-list" data-id="${x.i.id}" aria-label="Add ${esc(x.i.name)} to list">${ICON_CART}</button></li>`).join('') + '</ul>';
  }
  h += `<h2 class="sec">This trip <span class="count">${rows.length} item${rows.length === 1 ? '' : 's'}</span></h2>`;
  if (!rows.length) {
    h += `<ul class="list"><li><p class="empty">The list is empty. Type above to add something, or tap + next to anything that's running low.</p></li></ul>`;
  } else {
    h += '<ul class="list">' + rows.map(l => {
      const it = getItem(l.itemId), pt = priceTable(it.id);
      const meta = [it.brand, sizeText(it)].filter(Boolean).join(' · ');
      return `<li class="lrow${l.checked ? ' done' : ''}">
        <button class="check" data-action="toggle-check" data-id="${it.id}" aria-pressed="${l.checked ? 'true' : 'false'}" aria-label="In the cart: ${esc(it.name)}">${ICON_CHECK}</button>
        <div style="min-width:0"><button class="lname" data-action="open-item" data-id="${it.id}"><b>${esc(it.name)}</b>${meta ? `<small>${esc(meta)}</small>` : ''}</button>
          <div class="lmeta"><span class="step"><button data-action="qty-dec" data-id="${it.id}" aria-label="One fewer">−</button><span>${l.qty}</span><button data-action="qty-inc" data-id="${it.id}" aria-label="One more">+</button></span>${gradeChip(it.score)}</div></div>
        ${tagFor(pt)}
      </li>`;
    }).join('') + '</ul>';
    if (S.stores.length) {
      const c = listCompare();
      h += `<h2 class="sec">Where to shop</h2><div class="compare">`;
      if (c.splitStores.size > 1) h += `<div class="cmp split"><span class="lead">Cheapest split<small>${c.splitStores.size} stores${c.splitMissing ? ` · ${c.splitMissing} not priced` : ''}</small></span><b>${money(c.split)}</b></div>`;
      h += c.per.map((x, i) => `<div class="cmp"><span class="lead">${esc(x.st.name)}<small>${x.missing ? `${x.missing} not priced here` : (i === 0 ? 'Cheapest single store' : 'Every item priced')}</small></span><b>${money(x.total)}</b></div>`).join('');
      h += `</div><p class="hint">Uses the latest price you logged at each store, and the card price when it's lower.</p>`;
    }
    h += `<div class="row-actions"><button class="btn btn-primary wide" data-action="checkout">Log this trip</button></div>`;
    if (rows.some(l => l.checked)) h += `<div class="row-actions"><button class="btn-link" data-action="clear-checked">Remove checked items without logging</button></div>`;
  }
  const onList = new Set(S.list.map(l => l.itemId)), seen = new Set(), again = [];
  [...S.purchases].sort(cmpDate).reverse().forEach(p => {
    if (again.length < 12 && !seen.has(p.itemId) && !onList.has(p.itemId) && getItem(p.itemId)) { seen.add(p.itemId); again.push(getItem(p.itemId)); }
  });
  if (again.length) h += `<h2 class="sec">Buy again</h2><div class="chips">` + again.map(i => `<button class="chip" data-action="add-to-list" data-id="${i.id}">${esc(i.name)}</button>`).join('') + '</div>';
  return h;
}

function addMatches(q){
  q = q.trim().toLowerCase();
  if (!q) return '';
  const onList = new Set(S.list.map(l => l.itemId));
  const m = S.items.filter(i => (i.name + ' ' + (i.brand || '')).toLowerCase().includes(q)).slice(0, 6);
  return '<ul class="matches">' + m.map(i => `<li><button data-action="add-to-list" data-id="${i.id}"${onList.has(i.id) ? ' disabled' : ''}>${esc(i.name)}<small>${onList.has(i.id) ? 'Already on the list' : esc([i.brand, sizeText(i)].filter(Boolean).join(' · '))}</small></button></li>`).join('') +
    `<li><button data-action="new-item-named">+ New item “${esc(q)}”</button></li></ul>`;
}

/* Pantry */
function viewPantry(){
  const all = S.items.map(i => ({i, s:status(i)}));
  const inLoc = all.filter(x => ui.pantryLoc === 'all' || x.i.location === ui.pantryLoc);
  const shown = inLoc.filter(x => ui.showOut || (x.i.onHand || 0) > 0)
    .sort((a, b) => a.s.rank - b.s.rank || a.i.name.localeCompare(b.i.name));

  const onList = new Set(S.list.map(l => l.itemId));

  if (!shown.length) {
    h += `<ul class="list" style="margin-top:12px"><li><p class="empty">${S.items.length ? 'Nothing here right now. Logging a trip adds what you bought.' : 'No items yet. Add items from the List tab, then log a trip to stock the pantry.'}</p></li></ul>`;
  } else {
    h += '<ul class="list" style="margin-top:12px">' + shown.map(({i, s}) => `<li class="prow2">
      <button class="lname" data-action="open-item" data-id="${i.id}"><b style="font-weight:600">${esc(i.name)}</b><small>${esc((LOCS.find(l => l[0] === i.location) || LOCS[3])[1])}${s.st.dpu ? ` · every ~${Math.max(1, Math.round(s.st.dpu))} days` : ''}</small></button>
      ${s.level !== 'ok' ? `<span class="pill ${s.level}">${esc(s.label)}</span>` : ''}
      <span class="step"><button data-action="use-one" data-id="${i.id}" aria-label="Used one ${esc(i.name)}">−</button><span>${i.onHand || 0}</span><button data-action="add-one" data-id="${i.id}" aria-label="Add one ${esc(i.name)}">+</button></span>
      ${s.level !== 'ok' && !onList.has(i.id) ? `<button class="mini" data-action="add-to-list" data-id="${i.id}" aria-label="Add ${esc(i.name)} to list">${ICON_CART}</button>` : ''}
    </li>`).join('') + '</ul>';
  }
  h += `<p class="hint">Tap − when you finish one. Shelf Tag learns how fast you go through each item from your trips and flags it before it runs out.</p>`;
  return h;
}

function priceRows(q){

/* Health */
function chart(points){
  const W = 340, H = 178, L = 28, R = 8, T = 18, B = 24, ih = H - T - B, iw = W - L - R, n = points.length, bw = iw / n;
  let g = '';
  [0, 25, 50, 75, 100].forEach(y => { const yy = T + ih - (y / 100) * ih; g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="gl"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end" class="ax">${y}</text>`; });
  points.forEach((p, i) => {
    const w = Math.min(bw * 0.64, 40), x = L + i * bw + (bw - w) / 2, cur = i === n - 1;
    if (p.v != null) {
      const hgt = Math.max(2, (p.v / 100) * ih), gr = grade(p.v).toLowerCase();
      g += `<rect x="${x.toFixed(1)}" y="${(T + ih - hgt).toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" rx="2" style="fill:var(--ns-${gr})"${cur ? '' : ' opacity=".55"'}/>`;
      if (cur || n <= 6) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(T + ih - hgt - 5).toFixed(1)}" text-anchor="middle" class="val">${Math.round(p.v)}</text>`;
    } else {
      g += `<rect x="${x.toFixed(1)}" y="${T + ih - 2}" width="${w.toFixed(1)}" height="2" style="fill:var(--line)"/>`;
    }
    if (n <= 8 || i % 2 === (n - 1) % 2) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" class="ax">${esc(p.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average health score by period">${g}</svg>`;
}
function viewHealth(){
  const mode = ui.healthMode, m = healthMap(mode), keys = periodKeys(mode);
  const pts = keys.map(k => ({k, label:periodLabel(k, mode), v: m[k] ? m[k].sum / m[k].w : null, w: m[k] ? m[k].w : 0}));
  const cur = pts[pts.length - 1], prev = pts[pts.length - 2];
  const word = {week:'week', month:'month', year:'year'}[mode];
  let h = `<div class="seg" role="group" aria-label="Period" style="margin-top:4px">` + [['week','Week'],['month','Month'],['year','Year']].map(([k, l]) => `<button data-action="health-mode" data-mode="${k}" aria-pressed="${mode === k}">${l}</button>`).join('') + '</div>';
  if (!S.purchases.length) {
    return h + `<ul class="list" style="margin-top:14px"><li><p class="empty">Log a trip and your weekly, monthly and yearly health averages show up here.</p></li></ul>`;
  }
  let delta = '';
  if (cur.v != null && prev && prev.v != null) { const d = Math.round(cur.v - prev.v); delta = `${d > 0 ? '+' : d < 0 ? '−' : '±'}${Math.abs(d)} vs last ${word} · `; }
  h += `<div class="hero"><span class="num">${cur.v != null ? Math.round(cur.v) : '—'}</span>${cur.v != null ? gradeChip(cur.v) : ''}<div><p class="lbl">This ${word}'s average</p><p class="hint" style="margin:2px 0 0">${cur.v != null ? `${delta}${cur.w} item${cur.w === 1 ? '' : 's'} scored` : `Nothing scored yet this ${word}`}</p></div></div>`;
  h += `<div class="chart">${chart(pts)}</div><p class="hint">Average health score (1–100) of everything bought, weighted by quantity. A is 80+, E is under 20.</p>`;
  const since = addDays(today(), -30), agg = {};
  S.purchases.filter(p => p.date >= since).forEach(p => { const s = scoreOf(p); if (s == null) return; const it = getItem(p.itemId); agg[p.itemId] = {name: it ? it.name : p.name, s}; });
  const ranked = Object.values(agg).sort((a, b) => b.s - a.s);
  if (ranked.length >= 2) {
    const k = Math.min(3, Math.floor(ranked.length / 2));
    const li = x => `<li>${gradeChip(x.s, true)}<span>${esc(x.name)}</span></li>`;
    h += `<h2 class="sec">Last 30 days</h2><div class="cols"><div><h3>Best buys</h3><ul class="list">${ranked.slice(0, k).map(li).join('')}</ul></div><div><h3>Lowest scores</h3><ul class="list">${ranked.slice(-k).reverse().map(li).join('')}</ul></div></div>`;
  }
  const tr = trips().slice(0, 10);
  if (tr.length) {
    h += `<h2 class="sec">Recent trips</h2><ul class="list">` + tr.map(t => `<li class="trip"><div><b>${esc(storeName(t.storeId))}</b><small>${fmtDate(t.date)} · ${t.items.length} item${t.items.length === 1 ? '' : 's'}${t.w ? ` · health ${Math.round(t.sum / t.w)}` : ''}</small></div><span class="amt">${money(t.total)}</span><button class="btn-link" data-action="trip-to-list" data-trip="${esc(t.id)}">Add this trip to the list</button></li>`).join('') + '</ul>';
  }
  return h;
}

function saveItem(form){
  const name = $('#f-name').value.trim();
  if (!name) { $('#f-name').focus(); toast('Give the item a name first.'); return; }
  const id = form.dataset.id;
  const score = num($('#f-score').value);
  const fields = {
    name, brand: $('#f-brand').value.trim(), size: num($('#f-size').value) ?? '', unit: $('#f-unit').value,
    location: $('#f-loc').value, category: $('#f-cat').value,
    onHand: Math.max(0, Math.round(num($('#f-onhand').value) || 0)),
    score: score == null ? null : Math.min(100, Math.max(1, Math.round(score))),
    barcode: $('#f-barcode').value.trim()
  };
  const src = $('#f-score').dataset.src;
  if (id) {
    const it = getItem(id); Object.assign(it, fields);
    if (src) it.scoreSource = src;
    save(); closeSheet(); render(); toast('Saved ' + name);
  } else {
    const it = Object.assign({id:uid(), scoreSource: src || 'manual', created:today()}, fields);
    S.items.push(it);
    if (form.dataset.add) S.list.push({itemId:it.id, qty:1, checked:false});
    save(); closeSheet(); render(); toast(form.dataset.add ? `Added ${name} to the list` : 'Saved ' + name);
  }
}

    <label class="fld"><span>Date</span><input type="date" id="co-date" value="${today()}"></label></div>
    <p class="hint" style="margin:0">Check the price you paid for each item. It's saved as that store's latest price.</p>

    <ul class="list">${rows.map(l => { const it = getItem(l.itemId); if (!it) return ''; return `<li class="co-row" data-item="${it.id}">
      <input type="checkbox" class="co-inc" checked aria-label="Bought ${esc(it.name)}">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</span>
      <input type="number" class="co-qty" min="0" step="1" inputmode="numeric" value="${l.qty}" aria-label="Quantity of ${esc(it.name)}">
      <input type="number" class="co-price" min="0" step="0.01" inputmode="decimal" placeholder="0.00" aria-label="Price each for ${esc(it.name)}">
    </li>`; }).join('')}</ul></div>
    <div class="total"><span class="hint" style="margin:0">Trip total</span><b id="co-total">$0.00</b></div>
    <button class="btn btn-primary wide" type="submit">Save trip</button>
  </form>`;
  openSheet(h, () => {
    const fill = () => {
      const sid = $('#co-store').value;
      document.querySelectorAll('.co-row').forEach(r => {
        const inp = r.querySelector('.co-price'); if (inp.dataset.edited) return;
        const p = idx().latest[r.dataset.item + '|' + sid];
        inp.value = p ? eff(p).toFixed(2) : '';
      });
      total();
    };
    const total = () => {
      let t = 0;
      document.querySelectorAll('.co-row').forEach(r => {
        if (!r.querySelector('.co-inc').checked) return;
        t += (num(r.querySelector('.co-qty').value) || 0) * (num(r.querySelector('.co-price').value) || 0);
      });
      $('#co-total').textContent = money(t);
    };
    $('#co-store').addEventListener('change', fill);
    $('#coForm').addEventListener('input', e => { if (e.target.classList.contains('co-price')) e.target.dataset.edited = '1'; total(); });
    $('#coForm').addEventListener('change', total);
    fill();
  });
}

function saveTrip(){
  const sid = $('#co-store').value, date = $('#co-date').value || today(), tripId = 't' + uid();
  let n = 0, total = 0;
  document.querySelectorAll('.co-row').forEach(r => {
    if (!r.querySelector('.co-inc').checked) return;
    const qty = Math.max(0, Math.round(num(r.querySelector('.co-qty').value) || 0)); if (!qty) return;
    const price = num(r.querySelector('.co-price').value);
    const it = getItem(r.dataset.item); if (!it) return;
    S.purchases.push({id:uid(), tripId, itemId:it.id, storeId:sid, date, qty, price, score:it.score, name:it.name});
    if (price != null) {
      const prior = idx().latest[it.id + '|' + sid];
      const paidCard = prior && prior.card != null && Math.abs(prior.card - price) < 0.005;
      S.prices.push({id:uid(), itemId:it.id, storeId:sid, price: paidCard ? prior.price : price, card: paidCard ? price : null, date});
      total += price * qty;
    }
    it.onHand = (it.onHand || 0) + qty;
    S.list = S.list.filter(l => l.itemId !== it.id);
    n++;
  });
  if (!n) { toast('Check at least one item with a quantity.'); return; }
  save(); closeSheet(); render();
  toast(`Trip saved: ${n} item${n === 1 ? '' : 's'}, ${money(total)}`);
}

/* ---------- Open Food Facts ---------- */
const OFF_FIELDS = 'code,product_name,brands,quantity,nutriscore_grade,nutriscore_score,image_front_small_url,categories_tags';
function offScore(p){
  if (typeof p.nutriscore_score === 'number') return Math.min(100, Math.max(1, Math.round(100 - (p.nutriscore_score + 15) * 100 / 55)));
  const g = (p.nutriscore_grade || '').toLowerCase();
  return {a:90, b:70, c:50, d:30, e:10}[g] || null;
}
function offMap(p){
  const q = String(p.quantity || '');
  const m = q.match(/([\d.]+)\s*(fl\.?\s*oz|oz|lbs?|kg|g|ml|cl|l|ct|count)\b/i);
  let size = '', unit = '';
  if (m) { size = Number(m[1]); unit = m[2].toLowerCase().replace(/\s+/g, ' ').replace('fl. oz', 'fl oz').replace('lbs', 'lb').replace('count', 'ct'); if (unit === 'cl') { size = size * 10; unit = 'ml'; } }
  return {name:(p.product_name || '').trim(), brand:String(p.brands || '').split(',')[0].trim(), size, unit, barcode:p.code || '', score:offScore(p), grade:p.nutriscore_grade, img:p.image_front_small_url || ''};
}
async function offFetch(url){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
  try { const r = await fetch(url, {signal:ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
function applyOff(x){
  const set = (id, v) => { const el = $(id); if (el && v !== '' && v != null && (!el.value || id === '#f-score' || id === '#f-barcode')) el.value = v; };
  set('#f-name', x.name); set('#f-brand', x.brand); set('#f-size', x.size); set('#f-barcode', x.barcode);
  if (x.unit && UNITS.includes(x.unit)) $('#f-unit').value = x.unit;
  if (x.score != null) {
    $('#f-score').value = x.score; $('#f-score').dataset.src = 'off';
    $('#f-grade').innerHTML = gradeChip(x.score); $('#f-src').textContent = 'From Open Food Facts';
    $('#offStatus').textContent = `Found it. Nutri-Score ${String(x.grade || grade(x.score)).toUpperCase()}, health score ${x.score}.`;
  } else {
    $('#offStatus').textContent = 'Found the product, but it has no Nutri-Score yet. You can type a score yourself.';
  }
  $('#offResults').innerHTML = '';
}
const offFail = 'Couldn’t reach Open Food Facts. Check your connection and try again, or type the score yourself.';
async function offLookup(){
  const code = $('#f-barcode').value.replace(/\D/g, '');
  if (code.length < 6) { $('#offStatus').textContent = 'Enter the barcode number (usually 12 or 13 digits) or tap Scan.'; return; }
  $('#offStatus').textContent = 'Looking up ' + code + '…';
  try {
    const j = await offFetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    if (!j || j.status !== 1 || !j.product) { $('#offStatus').textContent = 'That barcode isn’t in Open Food Facts. Try searching by name, or type the score yourself.'; return; }
    j.product.code = j.product.code || code;
    applyOff(offMap(j.product));
  } catch (e) { $('#offStatus').textContent = offFail; }
}
async function offSearch(){
  const q = [$('#f-brand').value, $('#f-name').value].join(' ').trim();
  if (!q) { $('#offStatus').textContent = 'Type a name first, then search.'; return; }
  $('#offStatus').textContent = 'Searching for “' + q + '”…';
  try {
    const j = await offFetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10&fields=${OFF_FIELDS}`);
    offResults = (j.products || []).map(offMap).filter(x => x.name);
    if (!offResults.length) { $('#offStatus').textContent = 'No matches. Try fewer words, or the brand name.'; $('#offResults').innerHTML = ''; return; }
    $('#offStatus').textContent = 'Pick the closest match:';
    $('#offResults').innerHTML = '<ul class="off-list">' + offResults.map((x, i) => `<li><button type="button" data-action="off-pick" data-idx="${i}">${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : ''}<span><b style="font-weight:600">${esc(x.name)}</b><small>${esc([x.brand, x.size ? x.size + ' ' + x.unit : ''].filter(Boolean).join(' · '))}</small></span>${gradeChip(x.score)}</button></li>`).join('') + '</ul>';
  } catch (e) { $('#offStatus').textContent = offFail; }
}

/* ---------- barcode scanner (html5-qrcode, loaded on demand) ---------- */
let scanner = null, scanLib = null;
function loadScanLib(){
  if (window.Html5Qrcode) return Promise.resolve();
  if (scanLib) return scanLib;
  scanLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = () => res(); s.onerror = () => { scanLib = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return scanLib;
}
async function startScan(){
  const area = $('#scanArea'); if (!area) return;
  $('#offStatus').textContent = 'Starting camera…';
  try {
    await loadScanLib();
    area.hidden = false;
    scanner = new window.Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:260, height:120}}, text => {
      const code = String(text).replace(/\D/g, '');
      closeScanner();
      if (code) { $('#f-barcode').value = code; offLookup(); }
    }, () => {});
    $('#offStatus').textContent = 'Point the camera at the barcode.';
  } catch (e) {
    closeScanner();
    $('#offStatus').textContent = 'The camera isn’t available here. Type the barcode number instead, then tap Look up.';
  }
}
function closeScanner(){
  const area = $('#scanArea'); if (area) area.hidden = true;
  if (scanner) { const s = scanner; scanner = null; try { s.stop().then(() => s.clear()).catch(() => {}); } catch (e) {} }
}

/* ---------- live prices (your price server: Kroger / Walmart) ---------- */
const CLOSE_BTN = '<button class="icon-btn" data-action="close-sheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function liveOn(){ return !!(S.settings.live && S.settings.live.url); }
function liveStores(){ return liveOn() ? S.stores.filter(s => (s.source === 'kroger' && s.locationId) || s.source === 'walmart') : []; }
function storeSourceText(s){ return s.source === 'kroger' ? 'Live · ' + (s.locationName || 'Kroger store') : s.source === 'walmart' ? 'Live · Walmart online price' : ''; }
function agoText(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
  return Math.round(h / 24) + ' days ago';
}
function normUrl(u){ u = String(u || '').trim().replace(/\/+$/, ''); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u; return u; }
async function api(path){
  const L = S.settings.live;
  if (!L.url) throw new Error('Add your price server address in Settings first.');
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 15000);
  try {
    let r;
    try { r = await fetch(L.url + path, {headers: L.key ? {'X-App-Key': L.key} : {}, signal: ctl.signal}); }
    catch (e) { throw new Error('Couldn’t reach the price server. Check the address and your connection.'); }
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error) || ('The price server returned ' + r.status + '.'));
    return j;
  } finally { clearTimeout(tm); }
}
function searchTerm(it){ return [it.brand && !/^store brand$/i.test(it.brand) ? it.brand : '', it.name].filter(Boolean).join(' ').trim(); }
function liveSearch(store, term){
  return store.source === 'kroger'
    ? api(`/kroger/products?term=${encodeURIComponent(term)}&locationId=${encodeURIComponent(store.locationId)}&limit=12`)
    : api(`/walmart/search?q=${encodeURIComponent(term)}`);
}
function liveGet(store, pid){
  return store.source === 'kroger'
    ? api(`/kroger/product?id=${encodeURIComponent(pid)}&locationId=${encodeURIComponent(store.locationId)}`)
    : api(`/walmart/item?id=${encodeURIComponent(pid)}`);
}
// Saves a live price. Returns true if the price changed.
function recordLive(item, store, prod){
  if (!prod || (prod.price == null && prod.promo == null)) return false;
  const price = prod.price != null ? prod.price : prod.promo;
  const card = prod.promo != null && prod.price != null && prod.promo < prod.price ? prod.promo : null;
  const prior = idx().latest[item.id + '|' + store.id];
  if (prior && prior.src === 'live' && prior.price === price && (prior.card == null ? null : prior.card) === card) {
    prior.date = today(); memo = null; return false;
  }
  S.prices.push({id:uid(), itemId:item.id, storeId:store.id, price, card, date:today(), src:'live', label:prod.size || ''});
  memo = null;
  return true;
}
function linkedPairs(){
  const out = [];
  for (const store of liveStores()) for (const item of S.items) if (item.links && item.links[store.id]) out.push({item, store});
  return out;
}
let refreshing = false;
async function refreshLive(pairs, quiet){
  if (refreshing || !pairs.length) { if (!quiet && !pairs.length) toast('No items are matched to a live store yet. Open an item and tap Find match.'); return; }
  refreshing = true;
  let changed = 0, failed = 0, lastErr = '';
  const queue = pairs.slice();
  if (!quiet) toast(`Updating ${pairs.length} live price${pairs.length === 1 ? '' : 's'}…`);
  const run = async () => {
    while (queue.length) {
      const {item, store} = queue.shift();
      try { const r = await liveGet(store, item.links[store.id].id); if (recordLive(item, store, r.item)) changed++; }
      catch (e) { failed++; lastErr = e.message; }
    }
  };
  try { await Promise.all([run(), run(), run()]); }
  finally {
    refreshing = false;
    S.settings.lastRefresh = Date.now(); save(); render();
  }
  if (failed) toast(`${failed} price${failed === 1 ? '' : 's'} couldn’t be updated. ${lastErr}`);
  else if (!quiet) toast(changed ? `Live prices updated. ${changed} changed.` : 'Live prices are up to date.');
}

function storeConnectSheet(id){

let liveResults = [], liveCtx = null;
async function liveFind(itemId, storeId){
  const it = getItem(itemId), store = S.stores.find(s => s.id === storeId);
  if (!it || !store) return;
  const term = searchTerm(it);
  const st = $('#liveItemStatus'), box = $('#liveItemResults');
  st.textContent = `Searching ${store.name} for “${term}”…`; box.innerHTML = '';
  try {
    const j = await liveSearch(store, term);
    liveResults = (j.items || []).filter(x => x.name); liveCtx = {itemId, storeId};
    if (!liveResults.length) { st.textContent = `Nothing at ${store.name} matched “${term}”. Try renaming the item to what the store calls it.`; return; }
    st.textContent = `Pick the product that matches at ${store.name}:`;
    box.innerHTML = '<ul class="off-list">' + liveResults.map((x, i) => `<li><button type="button" data-action="live-pick" data-idx="${i}">${x.image ? `<img src="${esc(x.image)}" alt="" loading="lazy">` : ''}<span><b style="font-weight:600">${esc(x.name)}</b><small>${esc([x.size, x.promo != null ? `${money(x.promo)} with card, ${money(x.price)} regular` : (x.price != null ? money(x.price) : 'No price at this store')].filter(Boolean).join(' · '))}</small></span></button></li>`).join('') + '</ul>';
  } catch (e) { st.textContent = e.message; }
}

}

      st2.textContent = `Connected. Kroger keys ${j.kroger ? 'set' : 'not set yet'}. Walmart keys ${j.walmart ? 'set' : 'not set yet'}.`;
    } catch (e) { st.className = 'hint status-bad'; st.textContent = e.message; }
  },
  'store-connect': b => storeConnectSheet(b.dataset.id),
  'kroger-find': async b => {
    const zip = ($('#kZip').value || '').trim(), st = $('#kStatus'), box = $('#kResults');
    if (!/^\d{5}$/.test(zip)) { st.textContent = 'Enter a 5-digit ZIP code.'; return; }
    S.settings.zip = zip; save();
    st.textContent = 'Looking for stores near ' + zip + '…'; box.innerHTML = '';
    try {
      const j = await api('/kroger/locations?zip=' + zip + '&radius=15');
      const store = S.stores.find(s => s.id === b.dataset.id);
      const want = (store ? store.name : '').toLowerCase().replace(/[^a-z]/g, '');
      const locs = (j.locations || []).sort((x, y) => {
        const mx = (x.chain || '').toLowerCase().replace(/[^a-z]/g, '') === want ? 0 : 1, my = (y.chain || '').toLowerCase().replace(/[^a-z]/g, '') === want ? 0 : 1;
        return mx - my;
      });
      if (!locs.length) { st.textContent = 'No Kroger-family stores within 15 miles of that ZIP.'; return; }
      const hasHT = locs.some(l => /harris/i.test(l.chain + ' ' + l.name));
      st.textContent = hasHT ? 'Pick your store:' : 'Kroger didn’t return any Harris Teeter stores for this ZIP. Try the ZIP of the store itself.';
      box.innerHTML = '<ul class="off-list">' + locs.map(l => `<li><button type="button" data-action="kroger-pick" data-id="${esc(b.dataset.id)}" data-loc="${esc(l.id)}" data-name="${esc(l.name || l.chain)}"><span><b style="font-weight:600">${esc(l.name || l.chain)}</b><small>${esc(l.address)}</small></span></button></li>`).join('') + '</ul>';
    } catch (e) { st.textContent = e.message; }
  },
  'kroger-pick': b => {
    const s = S.stores.find(x => x.id === b.dataset.id); if (!s) return;
    s.source = 'kroger'; s.locationId = b.dataset.loc; s.locationName = b.dataset.name; save();
    closeSheet(); render(); toast(`${s.name} connected. Open an item and tap Find match.`);
  },
  'link-walmart': async b => {
    const s = S.stores.find(x => x.id === b.dataset.id), st = $('#wStatus'); if (!s) return;
    st.textContent = 'Checking the price server…';
    try {
      const j = await api('/health');
      if (!j.walmart) { st.textContent = 'Walmart keys aren’t on your price server yet. Add them once Walmart approves your account.'; return; }
      s.source = 'walmart'; delete s.locationId; delete s.locationName; save();
      closeSheet(); render(); toast(`${s.name} connected to Walmart prices.`);
    } catch (e) { st.textContent = e.message; }
  },
  'unlink-store': b => {
    const s = S.stores.find(x => x.id === b.dataset.id); if (!s) return;
    s.source = ''; delete s.locationId; delete s.locationName; save();
    closeSheet(); render(); toast(`${s.name} now uses the prices you log.`);
  },
  'live-find': b => liveFind(b.dataset.id, b.dataset.store),
  'live-pick': b => {
    const x = liveResults[Number(b.dataset.idx)]; if (!x || !liveCtx) return;
    const it = getItem(liveCtx.itemId), store = S.stores.find(s => s.id === liveCtx.storeId); if (!it || !store) return;
    it.links = it.links || {};
    it.links[store.id] = {id:x.id, name:x.name, size:x.size || ''};
    if (!it.barcode && x.upc && store.source === 'walmart') it.barcode = x.upc;
    const priced = recordLive(it, store, x) || x.price != null || x.promo != null;
    save(); itemSheet(it.id); render();
    toast(priced ? `Matched at ${store.name}` : `Matched, but ${store.name} shows no price for it right now.`);
  },
  'live-item-refresh': async b => {
    const it = getItem(b.dataset.id), store = S.stores.find(s => s.id === b.dataset.store);
    if (!it || !store) return;
    await refreshLive([{item:it, store}], false);
    if (!$('#sheetWrap').hidden) itemSheet(it.id);
  },
  'live-refresh': () => refreshLive(linkedPairs(), false)
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const fn = actions[b.dataset.action];
  if (fn) { e.preventDefault(); fn(b); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'itemForm') saveItem(f);
  else if (f.id === 'coForm') saveTrip();
  else if (f.id === 'priceForm') {
    const price = num($('#p-price').value), card = num($('#p-card').value);
    if (price == null && card == null) { toast('Enter a price first.'); return; }
    S.prices.push({id:uid(), itemId:f.dataset.id, storeId:$('#p-store').value, price: price != null ? price : card, card: price != null ? card : null, date:today()});
    save(); itemSheet(f.dataset.id); render(); toast('Price logged');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'addInput') $('#addMatches').innerHTML = addMatches(t.value);
  else if (t.id === 'priceQ') { priceQuery = t.value; $('#priceRows').innerHTML = priceRows(priceQuery); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) { closeSheet(); return; }
  if (e.target.id === 'addInput' && e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const onList = new Set(S.list.map(l => l.itemId));
    const exact = S.items.find(i => i.name.toLowerCase() === q);
    const first = exact || S.items.find(i => i.name.toLowerCase().includes(q) && !onList.has(i.id));
    if (first) addToList(first.id); else itemSheet(null, {name:e.target.value.trim(), _addToList:true});
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'showOut') { ui.showOut = t.checked; render(); }
  else if (t.dataset && t.dataset.store) {
    const s = S.stores.find(x => x.id === t.dataset.store);
    if (s) { s[t.dataset.field] = t.value.trim() || (t.dataset.field === 'name' ? 'Store' : ''); save(); }
  }
  else if (t.id === 'liveUrl') { S.settings.live.url = normUrl(t.value); t.value = S.settings.live.url; save(); }
  else if (t.id === 'liveKey') { S.settings.live.key = t.value.trim(); save(); }
  else if (t.id === 'setDays') { S.settings.suggestDays = Math.max(0, Math.min(30, Math.round(num(t.value) || 0))); save(); }
  else if (t.id === 'importFile' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.items) || !Array.isArray(data.stores)) throw new Error('shape');
        S = migrate(data); save(); ui.tab = 'list'; render(); toast(`Imported ${S.items.length} items and ${S.purchases.length} purchases`);
      } catch (err) { toast('That file isn’t a Shelf Tag backup.'); }
      t.value = '';
    };
    rd.readAsText(t.files[0]);
  }
});

render();

// Pull fresh live prices when the app opens, at most every 6 hours.
setTimeout(() => {
  if (liveOn() && Date.now() - (S.settings.lastRefresh || 0) > 6 * 3600e3) refreshLive(linkedPairs(), true);
}, 800);

/* Offline support when hosted (GitHub Pages). Skipped where service workers aren't allowed. */
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
} catch (e) {}
})();
</script>
</body>
</html>
